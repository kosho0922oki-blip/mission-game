/* Hand-drawn reference: three centered lines, overlapping the six tile boundaries. */
@media (max-width:650px) and (orientation:portrait){
 .back{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:0 3%;}
 .ribbon{flex:none;align-self:center;width:auto;min-width:43%;font-size:clamp(24px,7.2vw,42px);line-height:1.2;padding:1.3% 9%;margin:0 0 5%;}
 .message{display:block;width:100%;flex:none;text-align:center;font-size:clamp(20px,5.4vw,35px);line-height:1.75;letter-spacing:-.055em;white-space:nowrap;margin:0;}
 .message em{font-style:normal;color:#168532;}
}

/* Mobile-first override: true portrait board and centered reveal text */
@media (max-width: 800px) {
 html,body{width:100%;max-width:100%;overflow-x:hidden}
 main{min-height:100svh;min-height:100dvh;justify-content:flex-start;padding:calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 18px);gap:12px}
 .top,.stage,.bottom{width:100%;max-width:520px}
 .top{min-height:32px}.top strong{font-size:clamp(14px,4vw,19px)}.top span{font-size:clamp(13px,3.8vw,18px)}
 .stage{aspect-ratio:unset;height:auto;max-height:none;min-height:0;flex:none;aspect-ratio: 9 / 13.5;border-radius:18px}
 .cards{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr))}
 .back{background-size:cover;background-position:center center;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 3%;gap:0}
 .ribbon{width:auto;min-width:42%;font-size:clamp(22px,6.5vw,36px);line-height:1.2;padding:1.3% 8%;margin:0 0 4%}
 .message{width:100%;font-size:clamp(19px,5.15vw,32px);line-height:1.65;letter-spacing:-.055em;text-align:center;white-space:nowrap;margin:0}
 .paper .number{font-size:clamp(10px,2.8vw,14px)}.paper .task{font-size:clamp(12px,3.45vw,18px)}.paper .hint{font-size:clamp(9px,2.4vw,12px)}
 .bottom{flex-direction:column;align-items:flex-start;gap:10px}.controls{width:100%;justify-content:flex-start}.ctrl{min-height:44px}
}
@media (max-width:800px) and (max-height:760px){.stage{aspect-ratio:9/11.8}.paper .task{font-size:clamp(11px,3.2vw,16px)}}

/* Three distinct centered text zones across the portrait board. */
.stage .back{display:block;position:absolute;inset:0;padding:0;gap:0}
.stage .back .ribbon,.stage .back .destination,.stage .back .lunch{position:absolute;left:50%;transform:translate(-50%,-50%);margin:0;text-align:center;white-space:nowrap;max-width:98%;z-index:1}
.stage .back .ribbon{top:17%;width:auto;min-width:38%;}
.stage .back .destination{top:49%;width:100%;line-height:1.25;font-size:clamp(17px,5vw,38px);letter-spacing:-.05em}
.stage .back .lunch{top:77%;width:100%;line-height:1.25;font-size:clamp(17px,5vw,38px);letter-spacing:-.05em}
@media (min-width:801px){.stage .back .ribbon{top:18%}.stage .back .destination{top:49%}.stage .back .lunch{top:77%}}

/* FIX: the six opaque paper cards must sit ABOVE all destination text. */
.stage .back{z-index:0;pointer-events:none}
.stage .cards{z-index:5;isolation:isolate}
.stage .slot{z-index:0}
.stage .slot.open{z-index:2}
.stage .back .ribbon{top:16.67%;font-size:clamp(29px,9vw,64px);min-width:56%;padding:1.2% 9%;}
.stage .back .destination{top:50%;font-size:clamp(23px,6.7vw,52px);line-height:1.18;font-weight:900;white-space:nowrap;letter-spacing:-.065em;}
.stage .back .lunch{top:83.33%;font-size:clamp(23px,6.5vw,52px);line-height:1.18;font-weight:900;white-space:nowrap;letter-spacing:-.065em;}
@media (min-width:801px){.stage .back .ribbon{top:16.67%}.stage .back .destination{top:50%}.stage .back .lunch{top:83.33%}}

/* Introduction screen; original six-card board styles are unchanged */
body.intro-active main{display:none!important}
.intro-screen{display:none;min-height:100dvh;width:100%;padding:max(18px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));background:#10251e;color:#f8fff9;align-items:center;flex-direction:column;justify-content:center;gap:20px}
body.intro-active .intro-screen{display:flex}
.intro-header{width:min(100%,540px);font-size:clamp(17px,4.3vw,23px);font-weight:800;letter-spacing:.025em;text-align:left}
.intro-panel{width:min(100%,540px);border:3px solid #b6e8bb;border-radius:28px;padding:clamp(20px,5vw,35px) clamp(16px,5vw,30px) 30px;background:linear-gradient(145deg,rgba(232,248,240,.93),rgba(255,255,255,.97)),url('');color:#113024;box-shadow:0 14px 50px rgba(0,0,0,.18);display:flex;flex-direction:column;align-items:center;text-align:center;gap:clamp(16px,3vh,28px)}
.intro-ribbon{background:linear-gradient(110deg,#168b35,#086322);color:white;font-size:clamp(23px,7vw,39px);font-weight:900;padding:9px 36px;clip-path:polygon(0 0,100% 0,94% 50%,100% 100%,0 100%,6% 50%);line-height:1.15}
.intro-heading{font-size:clamp(32px,8.4vw,51px);font-weight:1000;line-height:1.25;letter-spacing:-.055em;margin:0}
.intro-heading span{display:block}.intro-underline{width:82%;height:9px;background:linear-gradient(90deg,#49c33f,#b9f39c);border-radius:80% 30% 60% 20%;transform:rotate(-2deg);margin-top:-15px}
.intro-copy{font-size:clamp(16px,4.3vw,22px);font-weight:700;line-height:1.7;margin:0}
.intro-copy strong{color:#087a2c;font-size:1.2em}
.intro-action{border:3px solid #f6fff6;border-radius:22px;background:linear-gradient(125deg,#279b39,#09652c);color:#fff;font:900 clamp(21px,6vw,31px) system-ui,'Noto Sans JP',sans-serif;width:100%;padding:19px 10px;cursor:pointer;box-shadow:0 7px 17px rgba(0,60,15,.22);touch-action:manipulation}
.intro-action:active{transform:scale(.985)}
@media(max-width:420px){.intro-screen{gap:12px}.intro-panel{gap:15px;padding:22px 17px 24px}.intro-copy{line-height:1.6}.intro-action{padding:17px 8px}}
</style></head><body class="intro-active"><section class="intro-screen" id="intro" aria-label="ミッション開始画面"><div class="intro-header">六本木ミッションラリー</div><div class="intro-panel"><div class="intro-ribbon">MISSION</div><h1 class="intro-heading"><span>次の目的地は</span><span>どこだ！？</span></h1><div class="intro-underline"></div><p class="intro-copy">六本木ヒルズに隠された<br><strong>6つ</strong>のミッション。</p><p class="intro-copy">クリアするたびに、<br>次の目的地が少しずつ明らかになる！</p><p class="intro-copy">6つすべてクリアして、<br>次の目的地を突き止めよう！</p><button class="intro-action" type="button" id="start-missions">チャレンジする！ ▶</button></div></section><main><div class="top"><strong>テレビ朝日 ミッションラリー</strong><span id="count">0 / 6 CLEAR</span></div><div class="stage"><div class="back"><div class="ribbon">NEXT</div><div class="message destination">次の目的地は<em>月島！</em></div><div class="message lunch">お昼ご飯を食べよう！</div></div><div class="cards" id="cards"></div></div><div class="bottom"><p>クリアしたミッションの紙をタップしてめくろう！</p><div id="finished" class="finished">🎉 ALL CLEAR!</div><div class="controls"><button class="ctrl" id="undo">1つ戻す</button><button class="ctrl" id="reset">最初から</button></div></div></main><script>
document.getElementById('start-missions').addEventListener('click',()=>{document.body.classList.remove('intro-active');window.scrollTo(0,0)});
const tasks=['タモリさんと\n２ショットを撮ろう','テレ朝のマスコットキャラ\n「ゴーちゃん。」と\n写真を撮ろう','どこでもドアをくぐる\n写真を撮ろう','一輪の真紅の薔薇の\nオブジェを見つけよう','ハートのオブジェの前で\nハートを作ろう','お気に入りの場所で\n6人の集合写真を撮ろう'];
const cards=document.getElementById('cards');let history=[];
function render(){cards.innerHTML='';tasks.forEach((task,i)=>{let slot=document.createElement('div');slot.className='slot'+(history.includes(i)?' open':'');let paper=document.createElement('button');paper.className='paper';paper.setAttribute('aria-label','ミッション'+(i+1)+'をめくる');paper.innerHTML='<span class="number">MISSION '+(i+1)+'</span><span class="task"></span><span class="hint">達成したらタップ ↗</span>';paper.querySelector('.task').textContent=task.replaceAll('\\n','\n');paper.addEventListener('click',()=>{if(!history.includes(i)){history.push(i);slot.classList.add('open');update()}});slot.append(paper);cards.append(slot)});update()}
function update(){document.getElementById('count').textContent=history.length+' / 6 CLEAR';document.getElementById('finished').classList.toggle('show',history.length===6)}
document.getElementById('undo').onclick=()=>{if(history.length){history.pop();render()}};document.getElementById('reset').onclick=()=>{history=[];render()};render();
</script></body></html>
