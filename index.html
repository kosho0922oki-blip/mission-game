gin:0;opacity:.8}.controls{display:flex;gap:8px}button.ctrl{border:1px solid #8cbfa1;background:#fff;color:#123a20;border-radius:9px;padding:9px 15px;font-weight:750;font-size:13px;cursor:pointer}.finished{display:none;color:#fff;background:#19833a;padding:9px 16px;border-radius:12px;font-weight:900}.finished.show{display:block}@media(max-width:550px){main{justify-content:center}.stage{aspect-ratio:9/13}.cards{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(3,1fr)}.paper .task{font-size:clamp(13px,3.5vw,20px)}.paper .number{font-size:11px}.paper .hint{font-size:10px}.message{font-size:clamp(23px,7vw,45px)}.bottom{align-items:flex-start;flex-direction:column}.top strong{font-size:15px}}
</style></head><body><main><div class="top"><strong>テレビ朝日 ミッションラリー</strong><span id="count">0 / 6 CLEAR</span></div><div class="stage"><div class="back"><div class="ribbon">NEXT</div><div class="message">次の目的地は<em>月島！</em><br>お昼ご飯を食べよう！</div></div><div class="cards" id="cards"></div></div><div class="bottom"><p>クリアしたミッションの紙をタップしてめくろう！</p><div id="finished" class="finished">🎉 ALL CLEAR!</div><div class="controls"><button class="ctrl" id="undo">1つ戻す</button><button class="ctrl" id="reset">最初から</button></div></div></main><script>
const tasks=['タモリさんと\nツーショットを撮れ！','ドラえもんを探して\n写真を撮れ！','館内の指定された\nものの数を調べろ！','テレビ番組の\n展示を見つけろ！','6人全員で\n集合写真を撮れ！','指定された商品を\nショップで探せ！'];
const cards=document.getElementById('cards');let history=[];
function render(){cards.innerHTML='';tasks.forEach((task,i)=>{let slot=document.createElement('div');slot.className='slot'+(history.includes(i)?' open':'');let paper=document.createElement('button');paper.className='paper';paper.setAttribute('aria-label','ミッション'+(i+1)+'をめくる');paper.innerHTML='<span class="number">MISSION '+(i+1)+'</span><span class="task"></span><span class="hint">達成したらタップ ↗</span>';paper.querySelector('.task').textContent=task.replaceAll('\\n','\n');paper.addEventListener('click',()=>{if(!history.includes(i)){history.push(i);slot.classList.add('open');update()}});slot.append(paper);cards.append(slot)});update()}
function update(){document.getElementById('count').textContent=history.length+' / 6 CLEAR';document.getElementById('finished').classList.toggle('show',history.length===6)}
document.getElementById('undo').onclick=()=>{if(history.length){history.pop();render()}};document.getElementById('reset').onclick=()=>{history=[];render()};render();
</script></body></html>
